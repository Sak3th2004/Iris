<!doctype html><html lang="en"><meta charset="utf-8"><title>Iris · Isolated work desk</title><style>body{font:16px system-ui;background:#f4f6ef;color:#304530;padding:40px}h1{font:40px Georgia}button{padding:14px;margin:8px;background:#fff;border:1px solid #abc09e;border-radius:8px;cursor:pointer}label{display:block;margin:16px 0}input{margin-left:16px;padding:10px}#form{background:white;padding:28px;border-radius:12px;margin-top:24px}small{color:#68775e}pre{white-space:pre-wrap}</style><h1>Iris work desk</h1><small>Isolated browser · invented records · every save goes through Iris</small><div id="records"></div><form id="form" hidden></form><pre id="result"></pre><script>
let records=[],form=null,job=null;
const polish=document.createElement('style');polish.textContent=`body{margin:0;padding:32px 40px;background:#f5f6f8;color:#333e4c;font-size:14px}h1{font:600 28px system-ui;letter-spacing:-1px;margin:0 0 8px}body>small{color:#8893a1;font-size:11px}#records{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}#records button{margin:0;padding:16px;text-align:left;background:white;border:1px solid #dce1e8;border-radius:9px;font-size:12px;color:#465367}#records button strong{font-size:14px;display:block;color:#303d4f;margin:6px 0}#records button small{display:block;font-size:10px;color:#8c97a5;line-height:1.7}.record-type{text-transform:uppercase;letter-spacing:1.4px;font-size:9px;color:#8691a2}#form{padding:24px 28px;border:1px solid #dce1e8;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}#form[hidden]{display:none}#form h2,#form p,#form button{grid-column:1/-1}#form h2{font-size:22px;font-weight:500;margin:0}#form p{color:#8792a1;font-size:11px;margin:4px 0 12px}#form label{margin:4px 0;font-size:11px;color:#748094;display:flex;flex-direction:column;gap:8px}#form input{margin:0;padding:11px 12px;border:1px solid #b5becb;border-radius:5px;color:#344256;background:#fafbfd;font-size:13px;outline-offset:3px}#form button{justify-self:end;padding:11px 36px;background:#364252;color:white;border:1px solid #364252;border-radius:6px;font-size:13px;margin-top:16px}[data-iris-active]{outline:3px solid #a3acba!important;outline-offset:4px!important;box-shadow:0 0 0 8px #8794a51a!important}#result{font:12px/1.7 system-ui;color:#4c6555;max-height:100px;overflow:auto;padding:12px 0}`;document.head.appendChild(polish);
const pointer=document.createElement('div');pointer.setAttribute('aria-hidden','true');pointer.style.cssText='position:fixed;width:14px;height:14px;background:#31563f;border:2px solid white;border-radius:50%;pointer-events:none;z-index:9999;left:-20px;top:-20px;box-shadow:0 0 0 3px #31563f40';document.body.appendChild(pointer);document.addEventListener('mousemove',e=>{pointer.style.left=(e.clientX-7)+'px';pointer.style.top=(e.clientY-7)+'px';});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){records=await(await fetch('/records')).json();document.querySelector('#records').innerHTML=records.map(r=>`<button data-record="${esc(r.record_id)}"><span class="record-type">${esc(r.resource_type)}</span><strong>${esc(r.fields.name)}</strong><small>${esc(r.fields.day? r.fields.day+' · '+r.fields.time : r.fields.item+' · Qty '+r.fields.quantity)} · $${esc(r.fields.price)}</small><small>${esc(r.record_id)} · v${r.version}</small></button>`).join('');}
function showRecord(record){form=structuredClone(record);const el=document.querySelector('#form');el.hidden=false;el.innerHTML=`<h2>${esc(form.fields.name)}</h2><p>${esc(form.resource_type)} / ${esc(form.record_id)} / version ${form.version}</p>`+Object.entries(form.fields).map(([k,v])=>`<label>${esc(k)}<input name="${esc(k)}" value="${esc(v)}" type="${typeof v==='number'?'number':'text'}"></label>`).join('')+'<button type="submit">Save</button>';}
document.querySelector('#records').onclick=e=>{const b=e.target.closest('button');if(b)showRecord(records.find(r=>r.record_id===b.dataset.record));};
function capture(){if(!form)return null;const result=structuredClone(form);document.querySelectorAll('#form input').forEach(el=>result.fields[el.name]=el.type==='number'?Number(el.value):el.value);return result;}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch(`/jobs/${job}/write`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(capture())});const answer=await r.json();document.querySelector('#result').textContent=answer.decision?answer.decision.verdict.toUpperCase()+' · '+answer.decision.reason+(answer.after?' Database version '+answer.after.version+'.':''):answer.detail;await load();if(answer.decision?.verdict==='allow'&&answer.after)showRecord(answer.after);};load();
</script></html>
