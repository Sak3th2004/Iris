<!doctype html><html lang="en"><meta charset="utf-8"><title>Iris · Isolated work desk</title><style>body{font:16px system-ui;background:#f4f6ef;color:#304530;padding:40px}h1{font:40px Georgia}button{padding:14px;margin:8px;background:#fff;border:1px solid #abc09e;border-radius:8px;cursor:pointer}label{display:block;margin:16px 0}input{margin-left:16px;padding:10px}#form{background:white;padding:28px;border-radius:12px;margin-top:24px}small{color:#68775e}pre{white-space:pre-wrap}</style><h1>Iris work desk</h1><small>Isolated browser · invented records · every save goes through Iris</small><div id="records"></div><form id="form" hidden></form><pre id="result"></pre><script>
let records=[],form=null,job=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){records=await(await fetch('/records')).json();document.querySelector('#records').innerHTML=records.map(r=>`<button data-record="${esc(r.record_id)}">${esc(r.fields.name)} / ${esc(r.resource_type)} / ${esc(r.record_id)}</button>`).join('');}
document.querySelector('#records').onclick=e=>{const b=e.target.closest('button');if(!b)return;form=structuredClone(records.find(r=>r.record_id===b.dataset.record));const el=document.querySelector('#form');el.hidden=false;el.innerHTML=`<h2>${esc(form.fields.name)}</h2><p>${esc(form.resource_type)} / ${esc(form.record_id)} / version ${form.version}</p>`+Object.entries(form.fields).map(([k,v])=>`<label>${esc(k)}<input name="${esc(k)}" value="${esc(v)}" type="${typeof v==='number'?'number':'text'}"></label>`).join('')+'<button type="submit">Save</button>';};
function capture(){if(!form)return null;const result=structuredClone(form);document.querySelectorAll('#form input').forEach(el=>result.fields[el.name]=el.type==='number'?Number(el.value):el.value);return result;}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const r=await fetch(`/jobs/${job}/write`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(capture())});document.querySelector('#result').textContent=JSON.stringify(await r.json());await load();};load();
</script></html>
